""<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Tarefa</title>
<link rel="stylesheet" href="style.css">
<body>
<header>
    <a href="editar.html">EDITAR</a>
</header>

<div class="container">

    <div class="left">

        <div class="title">
            EDITAR TAREFA
        </div>

        <div class="inputs">

            <div class="input-box">
                <input type="text" placeholder="NOME">
                <i class="fa-solid fa-pen"></i>
            </div>

            <div class="input-box">
                <input type="text" placeholder="CATEGORIA">
                <i class="fa-solid fa-pen"></i>
            </div>

        </div>

        <textarea class="textarea"
        placeholder="DESCRIÇÃO"></textarea>

    </div>

    <div class="right">

        <div class="priority-title">
            PRIORIDADE
        </div>

        <div class="priority-option">
            <span>ALTO</span>
            <input type="checkbox">
        </div>

        <div class="priority-option">
            <span>BAIXA</span>
            <input type="checkbox">
        </div>

        <div class="priority-option">
            <span>MÉDIO</span>
            <input type="checkbox">
        </div>

        <div class="icons">
            <i class="fa-regular fa-sun sun"></i>
            <i class="fa-regular fa-moon moon"></i>
        </div>

        <div class="checks">
            <input type="checkbox" checked>
            Dia
            <input type="checkbox">
            Noite
        </div>

        <button class="button">
            HORA DO DIA
        </button>

        <button class="button">
            EXCLUIR TAREFA
        </button>

    </div>
</div>
<div class=""></div>

</body>
</html>
