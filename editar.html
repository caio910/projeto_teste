!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Editar</title>
</head>
<body>
<header>
    <a href="index.html">voltar</a>
</header>
    <div class="container">

    <button class="btn-topo">
        ADICIONAR TAREFA
    </button>

    <div class="linha">

        <div class="esquerda">

            <div class="campo">
                <input type="text" placeholder="NOME">
                <i class="fa-regular fa-pen-to-square"></i>
            </div>

            <div class="campo">
                <input type="text" placeholder="CATEGORIA">
                <i class="fa-regular fa-pen-to-square"></i>
            </div>

        </div>

        <div class="direita">

            <div class="tema">

                <div class="opcao">
                    <i class="fa-regular fa-sun"></i>
                    <input type="checkbox">
                </div>

                <div class="opcao">
                    <i class="fa-regular fa-moon"></i>
                    <input type="checkbox" checked>
                </div>

            </div>

            <div class="campo hora">
                 <input type="text" placeholder="Hora do Dia">

                <i class="fa-regular fa-pen-to-square"></i>
            </div>

        </div>

    </div>

    <div class="descricao">
        <input type="text" placeholder="DESCRIÇÃO">
    </div>

</div>
    
</body>
</html>
